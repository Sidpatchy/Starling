name: Build mobile artifacts

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mobile_build:
        description: Select iOS only for an unsigned IPA build, or both mobile artifacts
        type: choice
        options:
          - ios-only
          - android-and-ios
        default: ios-only
        required: true
      upload_ios_to_app_store_connect:
        description: Sign the iOS IPA and upload it to App Store Connect
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      package_version: ${{ steps.version.outputs.package_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      android_code: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate and export version
        id: version
        shell: bash
        run: bash .github/scripts/resolve-version.sh

  android-apk:
    name: Unsigned Android APK
    if: github.event_name == 'pull_request' || github.event_name == 'release' || inputs.mobile_build == 'android-and-ios'
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Build release APK
        run: ./gradlew --no-daemon "-PstarlingVersion=${{ needs.resolve-version.outputs.app_version }}" "-PstarlingVersionCode=${{ needs.resolve-version.outputs.android_code }}" :androidApp:assembleRelease

      - name: Name APK with release version
        shell: bash
        run: |
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk \
            "artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-android-unsigned.apk"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v7
        with:
          name: starling-android-unsigned-apk-${{ needs.resolve-version.outputs.artifact_version }}
          path: artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-android-unsigned.apk
          if-no-files-found: error

  ios-ipa:
    name: Unsigned iOS IPA
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Rust for iOS cryptography
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Resolve Apple toolchain versions for caches
        id: ios-toolchain
        shell: bash
        run: |
          echo "xcode=$(xcodebuild -version | sed -n '1s/^Xcode //p')" >> "$GITHUB_OUTPUT"
          echo "sdk=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"
          echo "rust=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore embedded Python runtime cache
        id: ios-python-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            iosApp/Vendor/Python.xcframework
            iosApp/Sources/Starling/PythonModules/ios-device
            iosApp/Sources/Starling/PythonModules/ios-simulator
          key: ios-python-v1-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.ios-toolchain.outputs.xcode }}-sdk${{ steps.ios-toolchain.outputs.sdk }}-rust${{ steps.ios-toolchain.outputs.rust }}-py313-${{ hashFiles('packaging/ios/prepare-python-runtime.sh', 'packaging/ios/build-ios-cryptography-wheels.sh', 'packaging/ios/patch-cryptography-ios-build.py', 'packaging/ios/prepare-pyo3-cross-lib.py', 'packaging/ios/test-embedded-python.py', 'composeApp/src/main/python/**', 'licenses/**') }}

      - name: Prepare embedded iOS Python runtime
        if: steps.ios-python-cache.outputs.cache-hit != 'true'
        run: bash packaging/ios/prepare-python-runtime.sh

      - name: Save embedded Python runtime cache
        if: steps.ios-python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            iosApp/Vendor/Python.xcframework
            iosApp/Sources/Starling/PythonModules/ios-device
            iosApp/Sources/Starling/PythonModules/ios-simulator
          key: ${{ steps.ios-python-cache.outputs.cache-primary-key }}

      - name: Restore release Compose framework cache
        id: ios-compose-cache
        uses: actions/cache/restore@v5
        with:
          path: composeApp/build/XCFrameworks/release/composeApp.xcframework
          key: ios-compose-release-v1-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.ios-toolchain.outputs.xcode }}-sdk${{ steps.ios-toolchain.outputs.sdk }}-${{ hashFiles('composeApp/src/commonMain/**', 'composeApp/src/iosMain/**', 'composeApp/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release Compose iOS framework
        if: steps.ios-compose-cache.outputs.cache-hit != 'true'
        run: ./gradlew --no-daemon "-PstarlingVersion=${{ needs.resolve-version.outputs.app_version }}" :composeApp:assembleComposeAppReleaseXCFramework

      - name: Verify shared Compose framework
        run: test -f composeApp/build/XCFrameworks/release/composeApp.xcframework/Info.plist

      - name: Save release Compose framework cache
        if: steps.ios-compose-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: composeApp/build/XCFrameworks/release/composeApp.xcframework
          key: ${{ steps.ios-compose-cache.outputs.cache-primary-key }}

      - name: Generate release Xcode project
        env:
          STARLING_COMPOSE_CONFIGURATION: release
        run: xtool dev generate-xcode-project

      - name: Build app with the current iOS SDK
        env:
          STARLING_COMPOSE_CONFIGURATION: release
        shell: bash
        run: |
          derived_data="$RUNNER_TEMP/StarlingDerivedData"
          xcodebuild \
            -project xtool/.xtool-tmp/Starling.xcodeproj \
            -scheme Starling-App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          product_directory="$derived_data/Build/Products/Release-iphoneos"
          app_path="$(find "$product_directory" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Xcode did not produce an iOS app in $product_directory" >&2
            exit 1
          fi

          info_plist="$app_path/Info.plist"
          platform_name="$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$info_plist")"
          sdk_name="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$info_plist")"
          expected_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [[ "$platform_name" != iphoneos || "$sdk_name" != "iphoneos$expected_sdk" ]]; then
            echo "Unexpected app build metadata: platform=$platform_name sdk=$sdk_name expected=iphoneos$expected_sdk" >&2
            exit 1
          fi

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          binary_sdk="$(xcrun vtool -show-build "$app_path/$executable" | awk '$1 == "sdk" { print $2; exit }')"
          case "$binary_sdk" in
            "$expected_sdk"|"$expected_sdk".*) ;;
            *)
              echo "App binary SDK $binary_sdk does not match the installed iOS SDK $expected_sdk" >&2
              exit 1
              ;;
          esac

      - name: Package unsigned IPA with embedded Python
        shell: bash
        run: |
          product_directory="$RUNNER_TEMP/StarlingDerivedData/Build/Products/Release-iphoneos"
          app_path="$(find "$product_directory" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Xcode did not produce an iOS app" >&2
            exit 1
          fi
          mkdir -p artifacts
          bash packaging/ios/package-python-app.sh \
            "$app_path" \
            "artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-ios-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: starling-ios-unsigned-ipa-${{ needs.resolve-version.outputs.artifact_version }}
          path: artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-ios-unsigned.ipa
          if-no-files-found: error

  ios-app-store-connect:
    name: Sign and upload iOS build to App Store Connect
    if: github.event_name == 'release' || inputs.upload_ios_to_app_store_connect
    needs: [resolve-version, ios-ipa]
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download unsigned IPA
        uses: actions/download-artifact@v7
        with:
          name: starling-ios-unsigned-ipa-${{ needs.resolve-version.outputs.artifact_version }}
          path: artifacts

      - name: Sign IPA and upload to App Store Connect
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_MARKETING_VERSION: ${{ needs.resolve-version.outputs.package_version }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ipa_path="artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-ios-unsigned.ipa"
          test -f "$ipa_path"
          bash packaging/ios/sign-and-upload-ipa.sh \
            "$ipa_path" \
            "$RUNNER_TEMP/Starling-${{ needs.resolve-version.outputs.artifact_version }}-ios-signed.ipa"

  publish-release-assets:
    name: Attach mobile builds to release
    if: github.event_name == 'release'
    needs: [resolve-version, android-apk, ios-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v7
        with:
          name: starling-android-unsigned-apk-${{ needs.resolve-version.outputs.artifact_version }}
          path: release-assets

      - name: Download unsigned IPA
        uses: actions/download-artifact@v7
        with:
          name: starling-ios-unsigned-ipa-${{ needs.resolve-version.outputs.artifact_version }}
          path: release-assets

      - name: Attach builds to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
