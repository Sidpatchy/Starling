name: Build mobile artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      package_version: ${{ steps.version.outputs.package_version }}
      android_code: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate and export version
        id: version
        shell: bash
        run: |
          app_version="$(sed -n 's/^starlingVersion=//p' gradle.properties | tail -n 1)"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "gradle.properties must define starlingVersion as semantic version X.Y.Z[-prerelease]." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" && "$GITHUB_REF_NAME" != "$app_version" && "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "Release tag must be $app_version (optionally prefixed with v) to match gradle.properties." >&2
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "package_version=${app_version%%-*}" >> "$GITHUB_OUTPUT"

  android-apk:
    name: Unsigned Android APK
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37 build-tools;37.0.0

      - name: Build release APK
        run: ./gradlew --no-daemon "-PstarlingVersion=${{ needs.resolve-version.outputs.app_version }}" "-PstarlingVersionCode=${{ needs.resolve-version.outputs.android_code }}" :androidApp:assembleRelease

      - name: Name APK with release version
        shell: bash
        run: |
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk \
            "artifacts/Starling-${{ needs.resolve-version.outputs.app_version }}-android-unsigned.apk"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v7
        with:
          name: starling-android-unsigned-apk
          path: artifacts/Starling-${{ needs.resolve-version.outputs.app_version }}-android-unsigned.apk
          if-no-files-found: error

  ios-ipa:
    name: Unsigned iOS IPA
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Build Compose iOS framework
        run: ./gradlew --no-daemon "-PstarlingVersion=${{ needs.resolve-version.outputs.app_version }}" :composeApp:assembleComposeAppDebugXCFramework

      - name: Verify shared Compose framework
        run: test -f composeApp/build/XCFrameworks/debug/ComposeApp.xcframework/Info.plist

      - name: Build unsigned device IPA
        run: xtool dev build --configuration debug --ipa --triple arm64-apple-ios

      - name: Collect IPA
        shell: bash
        run: |
          ipa_path="$(find . -type f -name '*.ipa' -not -path './.git/*' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "xtool did not produce an IPA" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$ipa_path" "artifacts/Starling-${{ needs.resolve-version.outputs.app_version }}-ios-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: starling-ios-unsigned-ipa
          path: artifacts/Starling-${{ needs.resolve-version.outputs.app_version }}-ios-unsigned.ipa
          if-no-files-found: error

  publish-release-assets:
    name: Attach mobile builds to release
    if: github.event_name == 'release'
    needs: [resolve-version, android-apk, ios-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v7
        with:
          name: starling-android-unsigned-apk
          path: release-assets

      - name: Download unsigned IPA
        uses: actions/download-artifact@v7
        with:
          name: starling-ios-unsigned-ipa
          path: release-assets

      - name: Attach builds to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
