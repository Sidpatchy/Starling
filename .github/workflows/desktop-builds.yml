name: Build desktop packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      package_version: ${{ steps.version.outputs.package_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate and export version
        id: version
        shell: bash
        run: bash .github/scripts/resolve-version.sh

  linux-packages:
    name: Linux AppImage and Flatpak input
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build self-contained desktop image
        run: ./gradlew --no-daemon "-PstarlingVersion=${{ needs.resolve-version.outputs.app_version }}" "-PstarlingPackageVersion=${{ needs.resolve-version.outputs.package_version }}" :composeApp:createDistributable

      - name: Install AppImage extraction dependency
        run: sudo apt-get update && sudo apt-get install --yes libfuse2

      - name: Download AppImage tools
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output appimagetool-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum --check
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage

      - name: Package AppImage
        run: packaging/linux/build-appimage.sh
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.app_version }}

      - name: Archive desktop image for Flatpak
        run: |
          mkdir -p artifacts
          tar -czf artifacts/starling-jpackage-linux-x86_64.tar.gz \
            -C composeApp/build/compose/binaries/main/app Starling

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: starling-linux-appimage-x86_64-${{ needs.resolve-version.outputs.artifact_version }}
          path: composeApp/build/appimage/artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-x86_64.AppImage
          if-no-files-found: error

      - name: Upload Flatpak input image
        uses: actions/upload-artifact@v7
        with:
          name: starling-linux-jpackage-image-${{ needs.resolve-version.outputs.artifact_version }}
          path: artifacts/starling-jpackage-linux-x86_64.tar.gz
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak
    needs: [resolve-version, linux-packages]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download Linux application image
        uses: actions/download-artifact@v7
        with:
          name: starling-linux-jpackage-image-${{ needs.resolve-version.outputs.artifact_version }}
          path: downloaded

      - name: Restore application image for Flatpak Builder
        run: |
          mkdir -p composeApp/build/compose/binaries/main/app
          tar -xzf downloaded/starling-jpackage-linux-x86_64.tar.gz \
            -C composeApp/build/compose/binaries/main/app

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.sidpatchy.Starling.yml
          bundle: Starling-${{ needs.resolve-version.outputs.artifact_version }}-x86_64.flatpak
          branch: stable
          artifact-name: starling-linux-flatpak-x86_64-${{ needs.resolve-version.outputs.artifact_version }}

  windows-msi:
    name: Windows MSI
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk+jmods # Temurin 25 omits JMODs by default; Compose ProGuard requires them.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up WiX Toolset
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
          }
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3.*' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -ne $wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append }

      - name: Build unsigned Windows MSI
        run: .\gradlew.bat --no-daemon "-PstarlingVersion=${{ needs.resolve-version.outputs.app_version }}" "-PstarlingPackageVersion=${{ needs.resolve-version.outputs.package_version }}" :composeApp:packageReleaseMsi

      - name: Collect MSI
        shell: pwsh
        run: |
          $package = Get-ChildItem composeApp/build/compose/binaries -Recurse -Filter '*.msi' |
            Select-Object -First 1
          if ($null -eq $package) { throw 'Gradle did not produce an MSI.' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $package.FullName "artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-windows-x64.msi"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: starling-windows-msi-x64-${{ needs.resolve-version.outputs.artifact_version }}
          path: artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-windows-x64.msi
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk+jmods # Temurin 25 omits JMODs by default; Compose ProGuard requires them.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build unsigned macOS DMG
        env:
          ARTIFACT_VERSION: ${{ needs.resolve-version.outputs.artifact_version }}
          PACKAGE_VERSION: ${{ needs.resolve-version.outputs.package_version }}
        run: |
          mac_package_version="$PACKAGE_VERSION"
          if [[ "$mac_package_version" == 0.* ]]; then
            echo "macOS jpackage rejects zero-major versions; using 1.0.0 for the bundle metadata."
            mac_package_version=1.0.0
          fi
          ./gradlew --no-daemon "-PstarlingVersion=$APP_VERSION" "-PstarlingPackageVersion=$mac_package_version" :composeApp:packageReleaseDmg

      - name: Show jpackage diagnostics
        if: failure()
        shell: bash
        run: |
          for log in composeApp/build/compose/logs/createReleaseDistributable/*.txt; do
            [[ -f "$log" ]] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
          args_file=composeApp/build/compose/tmp/createReleaseDistributable.args.txt
          if [[ -f "$args_file" ]]; then
            echo "::group::$args_file"
            cat "$args_file"
            echo "::endgroup::"
          fi

      - name: Collect DMG
        run: |
          dmg_path="$(find composeApp/build/compose/binaries -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "Gradle did not produce a DMG." >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$dmg_path" "artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-macos-${{ matrix.arch }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: starling-macos-dmg-${{ matrix.arch }}-${{ needs.resolve-version.outputs.artifact_version }}
          path: artifacts/Starling-${{ needs.resolve-version.outputs.artifact_version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-release-assets:
    name: Attach desktop builds to release
    if: github.event_name == 'release'
    needs: [resolve-version, linux-packages, flatpak, windows-msi, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v7
        with:
          name: starling-linux-appimage-x86_64-${{ needs.resolve-version.outputs.artifact_version }}
          path: release-assets

      - name: Download Linux Flatpak
        uses: actions/download-artifact@v7
        with:
          name: starling-linux-flatpak-x86_64-${{ needs.resolve-version.outputs.artifact_version }}
          path: release-assets

      - name: Download Windows MSI
        uses: actions/download-artifact@v7
        with:
          name: starling-windows-msi-x64-${{ needs.resolve-version.outputs.artifact_version }}
          path: release-assets

      - name: Download Apple Silicon macOS DMG
        uses: actions/download-artifact@v7
        with:
          name: starling-macos-dmg-arm64-${{ needs.resolve-version.outputs.artifact_version }}
          path: release-assets

      - name: Download Intel macOS DMG
        uses: actions/download-artifact@v7
        with:
          name: starling-macos-dmg-x64-${{ needs.resolve-version.outputs.artifact_version }}
          path: release-assets

      - name: Attach builds to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
